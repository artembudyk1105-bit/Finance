name: Finance
options:
  bundleIdPrefix: com.foresight
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
targets:
  Finance:
    type: application
    platform: iOS
    sources:
      - path: Finance
      - path: Shared
    dependencies:
      - target: FinanceWidgets
        embed: true
    info:
      path: Finance/Info.plist
      properties:
        CFBundleDisplayName: Финансы
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы записывать траты голосом.
        NSSpeechRecognitionUsageDescription: Распознавание речи превращает фразу «кофе 250» в запись о трате. Работает на устройстве.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foresight.finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Финансы
  FinanceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FinanceWidgets
      - path: Shared
    info:
      path: FinanceWidgets/Info.plist
      properties:
        CFBundleDisplayName: Финансы
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.foresight.finance.widgets
        SKIP_INSTALL: YES
schemes:
  Finance:
    build:
      targets:
        Finance: all
        FinanceWidgets: all
